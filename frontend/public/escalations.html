<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Kisan Mitra — Escalations</title>
  <meta name="description" content="Real-time human escalation dashboard for Kisan Mitra AI farming voice agent." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ═══════════════════════════════════════════════════════════
       DESIGN TOKENS
    ═══════════════════════════════════════════════════════════ */
    :root {
      /* backgrounds */
      --bg-base:    #050810;
      --bg-mesh:    radial-gradient(ellipse 80% 60% at 50% -10%, rgba(59,130,246,.18) 0%, transparent 70%),
                    radial-gradient(ellipse 50% 40% at 90% 80%,  rgba(139,92,246,.12) 0%, transparent 60%),
                    radial-gradient(ellipse 40% 50% at 5%  70%,  rgba(16,185,129,.08) 0%, transparent 60%);
      --surface:    rgba(255,255,255,.04);
      --surface-h:  rgba(255,255,255,.07);
      --glass:      rgba(255,255,255,.03);
      --border:     rgba(255,255,255,.08);
      --border-h:   rgba(255,255,255,.16);

      /* text */
      --text:       #f1f5f9;
      --text-2:     #94a3b8;
      --text-3:     #475569;

      /* brand */
      --blue:       #3b82f6;
      --blue-d:     #1d4ed8;
      --blue-glow:  rgba(59,130,246,.35);
      --purple:     #8b5cf6;
      --green:      #10b981;
      --amber:      #f59e0b;
      --orange:     #f97316;
      --red:        #ef4444;

      /* urgency */
      --u-low:       #10b981;
      --u-low-bg:    rgba(16,185,129,.12);
      --u-mid:       #f59e0b;
      --u-mid-bg:    rgba(245,158,11,.12);
      --u-high:      #f97316;
      --u-high-bg:   rgba(249,115,22,.12);
      --u-emg:       #ef4444;
      --u-emg-bg:    rgba(239,68,68,.13);

      /* status */
      --s-open:      #3b82f6;
      --s-open-bg:   rgba(59,130,246,.12);
      --s-prog:      #a855f7;
      --s-prog-bg:   rgba(168,85,247,.12);
      --s-res:       #10b981;
      --s-res-bg:    rgba(16,185,129,.12);

      --radius:  16px;
      --radius-s: 10px;
      --radius-xs: 6px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg-base);
      background-image: var(--bg-mesh);
      background-attachment: fixed;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── animated grain overlay ───────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 180px;
      pointer-events: none;
      z-index: 0;
      opacity: .5;
    }

    /* ═══════════════════════════════════════════════════════════
       NAV / HEADER
    ═══════════════════════════════════════════════════════════ */
    nav {
      position: sticky;
      top: 0;
      z-index: 200;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      background: rgba(5,8,16,.75);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--border);
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, #059669 0%, #3b82f6 100%);
      border-radius: 10px;
      display: grid; place-items: center;
      font-size: 17px;
      box-shadow: 0 0 20px rgba(59,130,246,.4), 0 0 40px rgba(5,150,105,.2);
      flex-shrink: 0;
      position: relative;
    }

    .brand-icon::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 11px;
      background: linear-gradient(135deg, rgba(5,150,105,.6), rgba(59,130,246,.6));
      z-index: -1;
      filter: blur(6px);
    }

    .brand-text strong {
      display: block;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -.02em;
      line-height: 1.2;
      background: linear-gradient(90deg, #f1f5f9 30%, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand-text span {
      font-size: 11px;
      color: var(--text-3);
      font-weight: 400;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px;
      border-radius: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-2);
    }

    .live-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse-live 2s ease-in-out infinite;
    }

    .live-dot.disconnected {
      background: var(--red);
      box-shadow: 0 0 8px var(--red);
      animation: none;
    }

    @keyframes pulse-live {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: .5; transform: scale(.85); }
    }

    .btn-refresh {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: var(--radius-xs);
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-2);
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
    }

    .btn-refresh:hover {
      background: var(--surface-h);
      border-color: var(--border-h);
      color: var(--text);
    }

    .refresh-icon { display: inline-block; font-size: 14px; }
    .btn-refresh.spinning .refresh-icon { animation: spin-once .5s ease; }

    @keyframes spin-once {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* ═══════════════════════════════════════════════════════════
       PAGE LAYOUT
    ═══════════════════════════════════════════════════════════ */
    .page {
      position: relative;
      z-index: 1;
      max-width: 1280px;
      margin: 0 auto;
      padding: 36px 28px 80px;
    }

    /* ═══════════════════════════════════════════════════════════
       PAGE HERO
    ═══════════════════════════════════════════════════════════ */
    .hero {
      margin-bottom: 36px;
    }

    .hero h1 {
      font-size: clamp(26px, 4vw, 36px);
      font-weight: 800;
      letter-spacing: -.03em;
      line-height: 1.1;
      background: linear-gradient(135deg, #f1f5f9 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }

    .hero p {
      font-size: 14px;
      color: var(--text-2);
      font-weight: 400;
    }

    /* ═══════════════════════════════════════════════════════════
       STATS GRID
    ═══════════════════════════════════════════════════════════ */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }

    .stat-card {
      position: relative;
      padding: 22px 24px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      overflow: hidden;
      transition: transform .2s ease, border-color .2s, box-shadow .2s;
      cursor: default;
    }

    .stat-card:hover {
      transform: translateY(-3px);
      border-color: var(--border-h);
      box-shadow: 0 16px 40px rgba(0,0,0,.4);
    }

    /* glow blob in corner */
    .stat-card::before {
      content: '';
      position: absolute;
      width: 80px; height: 80px;
      border-radius: 50%;
      right: -20px; bottom: -20px;
      filter: blur(30px);
      opacity: .5;
    }

    .stat-card.c-open::before   { background: var(--s-open); }
    .stat-card.c-prog::before   { background: var(--s-prog); }
    .stat-card.c-res::before    { background: var(--s-res); }
    .stat-card.c-emg::before    { background: var(--u-emg); }

    .stat-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--text-3);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-icon {
      width: 20px; height: 20px;
      border-radius: 6px;
      display: grid; place-items: center;
      font-size: 11px;
    }

    .stat-icon.open  { background: var(--s-open-bg); }
    .stat-icon.prog  { background: var(--s-prog-bg); }
    .stat-icon.res   { background: var(--s-res-bg); }
    .stat-icon.emg   { background: var(--u-emg-bg); }

    .stat-value {
      font-size: 40px;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      line-height: 1;
      letter-spacing: -.03em;
    }

    .stat-value.open { color: var(--s-open); }
    .stat-value.prog { color: var(--s-prog); }
    .stat-value.res  { color: var(--s-res); }
    .stat-value.emg  { color: var(--u-emg); }

    .stat-sub {
      font-size: 11px;
      color: var(--text-3);
      margin-top: 4px;
    }

    /* ═══════════════════════════════════════════════════════════
       TOOLBAR
    ═══════════════════════════════════════════════════════════ */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -.01em;
    }

    .filter-pills {
      display: flex;
      gap: 6px;
    }

    .pill {
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-2);
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all .15s;
    }

    .pill:hover { border-color: var(--border-h); color: var(--text); }

    .pill.active {
      background: linear-gradient(135deg, var(--blue-d), var(--blue));
      border-color: transparent;
      color: #fff;
      box-shadow: 0 4px 14px rgba(59,130,246,.35);
    }

    /* ═══════════════════════════════════════════════════════════
       ERROR BANNER
    ═══════════════════════════════════════════════════════════ */
    .error-banner {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-radius: var(--radius-s);
      background: rgba(239,68,68,.08);
      border: 1px solid rgba(239,68,68,.2);
      color: #fca5a5;
      font-size: 13px;
      margin-bottom: 20px;
      animation: fade-in .3s ease;
    }

    .error-icon { font-size: 18px; flex-shrink: 0; }

    /* ═══════════════════════════════════════════════════════════
       CARDS
    ═══════════════════════════════════════════════════════════ */
    #cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
      gap: 20px;
    }

    .card {
      position: relative;
      border-radius: var(--radius);
      background: var(--glass);
      border: 1px solid var(--border);
      overflow: hidden;
      transition: transform .22s cubic-bezier(.34,1.56,.64,1), box-shadow .22s ease, border-color .2s;
      animation: card-in .35s ease both;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    @keyframes card-in {
      from { opacity: 0; transform: translateY(18px) scale(.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card:hover {
      transform: translateY(-4px) scale(1.005);
      box-shadow: 0 24px 60px rgba(0,0,0,.5), 0 0 0 1px var(--border-h);
      border-color: var(--border-h);
    }

    /* urgency strip — top edge */
    .card-strip {
      height: 3px;
      width: 100%;
    }

    .card[data-urgency="low"]       .card-strip { background: linear-gradient(90deg, var(--u-low), transparent); }
    .card[data-urgency="medium"]    .card-strip { background: linear-gradient(90deg, var(--u-mid), transparent); }
    .card[data-urgency="high"]      .card-strip { background: linear-gradient(90deg, var(--u-high), transparent); }
    .card[data-urgency="emergency"] .card-strip {
      background: linear-gradient(90deg, var(--u-emg), #f97316, transparent);
      animation: strip-pulse 1.4s ease-in-out infinite;
    }

    @keyframes strip-pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .4; }
    }

    /* ── Card body ─────────────────────────────────────────── */
    .card-body {
      padding: 22px 24px 20px;
    }

    /* card top row */
    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .card-top-left {}

    .ref-id {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      color: var(--blue);
      letter-spacing: .04em;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ref-copy-btn {
      width: 18px; height: 18px;
      border-radius: 4px;
      border: none;
      background: rgba(59,130,246,.12);
      color: var(--blue);
      font-size: 10px;
      cursor: pointer;
      display: grid; place-items: center;
      opacity: 0;
      transition: opacity .15s;
    }

    .ref-id:hover .ref-copy-btn { opacity: 1; }

    .farmer-name {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -.02em;
      color: var(--text);
      line-height: 1.2;
    }

    .card-badges {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 5px;
      flex-shrink: 0;
    }

    /* badge base */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      white-space: nowrap;
    }

    .badge-dot { width: 5px; height: 5px; border-radius: 50%; }

    /* urgency badges */
    .b-u-low       { background: var(--u-low-bg);  color: var(--u-low); }
    .b-u-medium    { background: var(--u-mid-bg);  color: var(--u-mid); }
    .b-u-high      { background: var(--u-high-bg); color: var(--u-high); }
    .b-u-emergency { background: var(--u-emg-bg);  color: var(--u-emg); animation: badge-pulse 1.2s ease infinite; }

    @keyframes badge-pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .6; }
    }

    /* status badges */
    .b-s-open        { background: var(--s-open-bg); color: var(--s-open); }
    .b-s-in_progress { background: var(--s-prog-bg); color: var(--s-prog); }
    .b-s-resolved    { background: var(--s-res-bg);  color: var(--s-res); }

    /* trigger badge */
    .b-trigger { background: rgba(148,163,184,.08); color: var(--text-2); }

    /* ── Info chips ───────────────────────────────────────── */
    .info-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .chip {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: var(--radius-xs);
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-2);
    }

    .chip-icon { font-size: 12px; }

    /* ── Summary box ─────────────────────────────────────── */
    .summary-wrap {
      border-radius: var(--radius-s);
      background: rgba(0,0,0,.25);
      border: 1px solid rgba(255,255,255,.05);
      padding: 16px;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }

    /* left accent bar colored by trigger */
    .summary-wrap::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      border-radius: 2px 0 0 2px;
    }

    [data-urgency="low"]       .summary-wrap::before { background: var(--u-low); }
    [data-urgency="medium"]    .summary-wrap::before { background: var(--u-mid); }
    [data-urgency="high"]      .summary-wrap::before { background: var(--u-high); }
    [data-urgency="emergency"] .summary-wrap::before { background: var(--u-emg); }

    .summary-label {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--text-3);
      margin-bottom: 6px;
    }

    .summary-text {
      font-size: 13px;
      color: var(--text);
      line-height: 1.6;
      margin-left: 10px; /* indent past accent bar */
    }

    .already-tried {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,.05);
    }

    .already-tried .summary-label { color: var(--text-3); }

    .already-tried .summary-text { color: var(--text-2); font-size: 12px; }

    /* ── Timestamp ───────────────────────────────────────── */
    .card-time {
      font-size: 11px;
      color: var(--text-3);
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ── Action buttons ──────────────────────────────────── */
    .card-actions {
      display: flex;
      gap: 8px;
    }

    .act-btn {
      flex: 1;
      padding: 9px 14px;
      border-radius: var(--radius-s);
      border: 1px solid var(--border);
      background: rgba(255,255,255,.04);
      color: var(--text-2);
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .act-btn:disabled { opacity: .35; cursor: default; }

    .act-btn.btn-prog {
      border-color: rgba(168,85,247,.3);
      color: var(--s-prog);
    }

    .act-btn.btn-prog:hover:not(:disabled) {
      background: var(--s-prog-bg);
      border-color: var(--s-prog);
      box-shadow: 0 4px 16px rgba(168,85,247,.2);
    }

    .act-btn.btn-res {
      background: linear-gradient(135deg, rgba(5,150,105,.15), rgba(16,185,129,.1));
      border-color: rgba(16,185,129,.3);
      color: var(--s-res);
    }

    .act-btn.btn-res:hover:not(:disabled) {
      background: linear-gradient(135deg, rgba(5,150,105,.25), rgba(16,185,129,.2));
      border-color: var(--s-res);
      box-shadow: 0 4px 16px rgba(16,185,129,.2);
    }

    .act-btn.done {
      border-color: rgba(16,185,129,.2);
      color: var(--s-res);
      cursor: default;
    }

    /* ═══════════════════════════════════════════════════════════
       EMPTY STATE
    ═══════════════════════════════════════════════════════════ */
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 24px;
    }

    .empty-icon-wrap {
      width: 72px; height: 72px;
      margin: 0 auto 20px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(16,185,129,.15), rgba(59,130,246,.1));
      border: 1px solid rgba(16,185,129,.2);
      display: grid; place-items: center;
      font-size: 34px;
    }

    .empty h2 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -.02em;
      margin-bottom: 6px;
    }

    .empty p { font-size: 13px; color: var(--text-2); }

    /* ═══════════════════════════════════════════════════════════
       LOADING SKELETON
    ═══════════════════════════════════════════════════════════ */
    .skeleton-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
      gap: 20px;
    }

    .skeleton-card {
      height: 280px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .skeleton-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.04) 50%, transparent 100%);
      animation: shimmer 1.6s ease-in-out infinite;
    }

    @keyframes shimmer {
      from { transform: translateX(-100%); }
      to   { transform: translateX(100%); }
    }

    /* ═══════════════════════════════════════════════════════════
       UTILITIES
    ═══════════════════════════════════════════════════════════ */
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ═══════════════════════════════════════════════════════════
       RESPONSIVE
    ═══════════════════════════════════════════════════════════ */
    @media (max-width: 768px) {
      nav { padding: 0 18px; }
      .page { padding: 24px 16px 60px; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
      #cards, .skeleton-grid { grid-template-columns: 1fr; }
      .toolbar { flex-direction: column; align-items: flex-start; }
    }

    @media (max-width: 420px) {
      .stats-grid { grid-template-columns: 1fr; }
    }

    /* ═══════════════════════════════════════════════════════════
       TOAST NOTIFICATION
    ═══════════════════════════════════════════════════════════ */
    #toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 9999;
      padding: 12px 18px;
      border-radius: var(--radius-s);
      background: rgba(15,25,40,.95);
      border: 1px solid var(--border-h);
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(0,0,0,.5);
      transform: translateY(80px);
      opacity: 0;
      transition: transform .3s cubic-bezier(.34,1.56,.64,1), opacity .3s;
      max-width: 300px;
    }

    #toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

<!-- ── Nav ──────────────────────────────────────────────────────────── -->
<nav>
  <div class="nav-brand">
    <div class="brand-icon">🌾</div>
    <div class="brand-text">
      <strong>Kisan Mitra</strong>
      <span>Human Escalation Center</span>
    </div>
  </div>
  <div class="nav-right">
    <div class="live-indicator">
      <div class="live-dot" id="live-dot"></div>
      <span id="live-text">Connecting…</span>
    </div>
    <button class="btn-refresh" id="btn-refresh" onclick="manualRefresh()">
      <span class="refresh-icon" id="refresh-icon">↻</span>
      Refresh
    </button>
  </div>
</nav>

<!-- ── Page ─────────────────────────────────────────────────────────── -->
<div class="page">

  <!-- Hero -->
  <div class="hero">
    <h1>Escalation Requests</h1>
    <p>Live feed of farmer cases that need a human expert. Auto-refreshes every 30 seconds.</p>
  </div>

  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card c-open">
      <div class="stat-label">
        <span class="stat-icon open">📋</span>Open
      </div>
      <div class="stat-value open" id="st-open">–</div>
      <div class="stat-sub">Awaiting agent</div>
    </div>
    <div class="stat-card c-prog">
      <div class="stat-label">
        <span class="stat-icon prog">⚙️</span>In Progress
      </div>
      <div class="stat-value prog" id="st-prog">–</div>
      <div class="stat-sub">Agent assigned</div>
    </div>
    <div class="stat-card c-res">
      <div class="stat-label">
        <span class="stat-icon res">✅</span>Resolved
      </div>
      <div class="stat-value res" id="st-res">–</div>
      <div class="stat-sub">Closed cases</div>
    </div>
    <div class="stat-card c-emg">
      <div class="stat-label">
        <span class="stat-icon emg">🚨</span>Emergency
      </div>
      <div class="stat-value emg" id="st-emg">–</div>
      <div class="stat-sub">Immediate attention</div>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="section-title">All Cases</div>
    <div class="filter-pills">
      <button class="pill active" id="f-all"         onclick="setFilter(null, this)">All</button>
      <button class="pill"        id="f-open"        onclick="setFilter('open', this)">🔵 Open</button>
      <button class="pill"        id="f-in_progress" onclick="setFilter('in_progress', this)">🟣 In Progress</button>
      <button class="pill"        id="f-resolved"    onclick="setFilter('resolved', this)">🟢 Resolved</button>
    </div>
  </div>

  <!-- Error banner -->
  <div class="error-banner" id="err">
    <span class="error-icon">⚠️</span>
    <span id="err-msg"></span>
  </div>

  <!-- Cards -->
  <div id="cards">
    <div class="skeleton-grid" style="grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(480px,1fr));gap:20px">
      <div class="skeleton-card"></div>
      <div class="skeleton-card" style="animation-delay:.15s"></div>
    </div>
  </div>

</div>

<!-- Toast -->
<div id="toast"></div>

<script>
  /* ── Config ──────────────────────────────────────────────────────── */
  const API     = 'http://localhost:8001';
  const REFRESH = 30_000;

  let filter   = null;
  let timer    = null;
  let records  = [];

  /* ── Helpers ─────────────────────────────────────────────────────── */
  const $ = id => document.getElementById(id);

  function toast(msg, ok = true) {
    const el = $('toast');
    el.textContent = (ok ? '✓  ' : '⚠  ') + msg;
    el.style.borderColor = ok ? 'rgba(16,185,129,.3)' : 'rgba(239,68,68,.3)';
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 3200);
  }

  function urgencyEmoji(u) {
    return { low:'🟢', medium:'🟡', high:'🟠', emergency:'🔴' }[u] ?? '⚪';
  }

  function triggerLabel(t) {
    return { crop_emergency:'🌾 Crop Emergency', market_data_missing:'📊 Market Data Missing' }[t] ?? ('📋 ' + t);
  }

  function contactLabel(c) {
    return { phone:'📞 Phone', whatsapp:'💬 WhatsApp', none:'🔕 None' }[c] ?? ('📞 ' + c);
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleString('en-IN', { dateStyle:'medium', timeStyle:'short' });
  }

  /* ── Fetch ───────────────────────────────────────────────────────── */
  async function load() {
    const url = filter ? `${API}/escalations?status=${filter}` : `${API}/escalations`;
    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const data = await r.json();
      records = data.escalations ?? [];
      hideErr();
      setLive(true);
      render(records);
      updateStats(data.escalations ?? []);
    } catch(e) {
      setLive(false);
      showErr(`Cannot reach API at ${API}. Make sure escalations_api.py is running on port 8001. (${e.message})`);
      $('cards').innerHTML = '';
    }
    $('live-text').textContent = 'Updated ' + new Date().toLocaleTimeString('en-IN');
  }

  /* ── Render ──────────────────────────────────────────────────────── */
  function render(recs) {
    const el = $('cards');

    if (!recs.length) {
      el.innerHTML = `
        <div class="empty">
          <div class="empty-icon-wrap">✅</div>
          <h2>All clear</h2>
          <p>No escalations match this filter. The AI agent is handling everything.</p>
        </div>`;
      updateTitle(0); return;
    }

    el.innerHTML = recs.map((r, i) => `
      <div class="card" data-urgency="${r.urgency}" id="card-${r.reference_id}" style="animation-delay:${i * 0.06}s">
        <div class="card-strip"></div>
        <div class="card-body">

          <!-- top -->
          <div class="card-top">
            <div class="card-top-left">
              <div class="ref-id">
                ${r.reference_id}
                <button class="ref-copy-btn" onclick="copyRef('${r.reference_id}')" title="Copy ID">⎘</button>
              </div>
              <div class="farmer-name">${r.farmer_name || 'Unknown Farmer'}</div>
            </div>
            <div class="card-badges">
              <span class="badge b-u-${r.urgency}">
                <span class="badge-dot" style="background:currentColor"></span>
                ${r.urgency.toUpperCase()}
              </span>
              <span class="badge b-s-${r.status}">${r.status.replace('_', ' ')}</span>
              <span class="badge b-trigger">${triggerLabel(r.trigger_type)}</span>
            </div>
          </div>

          <!-- chips -->
          <div class="info-chips">
            <span class="chip"><span class="chip-icon">🆔</span>${r.farmer_id || '—'}</span>
            <span class="chip"><span class="chip-icon">🗣</span>${r.language || '—'}</span>
            <span class="chip"><span class="chip-icon">${r.contact_method==='whatsapp'?'💬':'📞'}</span>${r.contact_method || '—'}</span>
            <span class="chip"><span class="chip-icon">📅</span>${fmtDate(r.created_at)}</span>
          </div>

          <!-- summary -->
          <div class="summary-wrap">
            <div class="summary-label">Situation Summary</div>
            <div class="summary-text">${r.situation_summary || '—'}</div>
            ${r.already_checked ? `
            <div class="already-tried">
              <div class="summary-label">Agent Already Tried</div>
              <div class="summary-text">${r.already_checked}</div>
            </div>` : ''}
          </div>

          <!-- time -->
          <div class="card-time">
            🕐 Last updated: ${fmtDate(r.updated_at)}
          </div>

          <!-- actions -->
          <div class="card-actions">
            ${r.status !== 'in_progress' && r.status !== 'resolved' ? `
              <button class="act-btn btn-prog"
                      id="pb-${r.reference_id}"
                      onclick="updateStatus('${r.reference_id}','in_progress')">
                ⚙️ In Progress
              </button>` : ''}
            ${r.status !== 'resolved' ? `
              <button class="act-btn btn-res"
                      id="rb-${r.reference_id}"
                      onclick="updateStatus('${r.reference_id}','resolved')">
                ✓ Mark Resolved
              </button>` : `
              <button class="act-btn done" disabled>✓ Resolved</button>`}
          </div>

        </div>
      </div>
    `).join('');

    updateTitle(recs.filter(r => r.status === 'open').length);
  }

  /* ── Stats ───────────────────────────────────────────────────────── */
  function updateStats(recs) {
    $('st-open').textContent = recs.filter(r => r.status === 'open').length;
    $('st-prog').textContent = recs.filter(r => r.status === 'in_progress').length;
    $('st-res').textContent  = recs.filter(r => r.status === 'resolved').length;
    $('st-emg').textContent  = recs.filter(r => r.urgency === 'emergency').length;
  }

  function updateTitle(open) {
    document.title = open > 0 ? `(${open}) Kisan Mitra — Escalations` : 'Kisan Mitra — Escalations';
    $('page-title').textContent = document.title;
  }

  /* ── Status update ───────────────────────────────────────────────── */
  async function updateStatus(refId, newStatus) {
    [$(`pb-${refId}`), $(`rb-${refId}`)].forEach(b => b && (b.disabled = true));
    try {
      const r = await fetch(`${API}/escalations/${refId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: newStatus }),
      });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      toast(`${refId} → ${newStatus.replace('_', ' ')}`);
      await load();
    } catch(e) {
      toast(`Failed to update: ${e.message}`, false);
      [$(`pb-${refId}`), $(`rb-${refId}`)].forEach(b => b && (b.disabled = false));
    }
  }

  /* ── Copy ref ────────────────────────────────────────────────────── */
  function copyRef(refId) {
    navigator.clipboard?.writeText(refId).then(() => toast(`Copied ${refId}`));
  }

  /* ── Filters ─────────────────────────────────────────────────────── */
  function setFilter(status, btn) {
    filter = status;
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    load();
  }

  /* ── Refresh ─────────────────────────────────────────────────────── */
  function manualRefresh() {
    $('btn-refresh').classList.add('spinning');
    setTimeout(() => $('btn-refresh').classList.remove('spinning'), 600);
    load();
    resetTimer();
  }

  function resetTimer() {
    clearInterval(timer);
    timer = setInterval(load, REFRESH);
  }

  /* ── Connection ──────────────────────────────────────────────────── */
  function setLive(ok) {
    const dot = $('live-dot');
    dot.className = 'live-dot' + (ok ? '' : ' disconnected');
  }

  /* ── Error ───────────────────────────────────────────────────────── */
  function showErr(msg) {
    const el = $('err');
    $('err-msg').textContent = msg;
    el.style.display = 'flex';
  }

  function hideErr() { $('err').style.display = 'none'; }

  /* ── Boot ────────────────────────────────────────────────────────── */
  load();
  resetTimer();
</script>
</body>
</html>
